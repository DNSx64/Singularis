[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/singularis-mls",
    "crates/singularis-protocol",
    "crates/singularis-server",
    "crates/singularis-vault",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0.98"
argon2 = { version = "0.5.3", features = ["std", "zeroize"] }
async-trait = "0.1.88"
axum = "0.8.4"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
getrandom = "0.3.3"
hex = "0.4.3"
http = "1.3.1"
openmls = { git = "https://github.com/openmls/openmls", rev = "aefca1c182feb431e86fb9fcc74d912f4688639c" }
openmls_basic_credential = { git = "https://github.com/openmls/openmls", rev = "aefca1c182feb431e86fb9fcc74d912f4688639c" }
openmls_rust_crypto = { git = "https://github.com/openmls/openmls", rev = "aefca1c182feb431e86fb9fcc74d912f4688639c" }
reqwest = { version = "0.12.22", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.37.0", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
singularis-mls = { path = "crates/singularis-mls" }
singularis-protocol = { path = "crates/singularis-protocol" }
singularis-vault = { path = "crates/singularis-vault" }
tempfile = "3.20.0"
thiserror = "2.0.12"
time = { version = "0.3.41", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1.45.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["cors", "limit", "request-id", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
tauri = "2"
tauri-build = "2"
uuid = { version = "1.16.0", features = ["serde", "v4"] }
zeroize = "1.8.1"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
